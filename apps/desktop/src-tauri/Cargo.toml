[package]
name = "ultron-jarvis"
version = "1.0.0"
description = "ULTRON JARVIS desktop mission control"
authors = ["ULTRON"]
edition = "2021"

[lib]
name = "ultron_jarvis_lib"
crate-type = ["staticlib","cdylib","rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
