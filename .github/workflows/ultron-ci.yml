name: ULTRON CI
on:
  push:
    branches: [main, 'feature/ultron-v34-bounded-revenue-autonomy']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ultron_test
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: ultron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ultron_test -d ultron_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ultron_test:ci_ephemeral_only@localhost:5432/ultron_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure media and printable checks are available
        run: (command -v ffmpeg && command -v pdfinfo && command -v unzip && command -v soffice) || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils unzip libreoffice-writer libreoffice-calc libreoffice-impress fonts-dejavu-core)
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Verify official-image startup without Railway builds
        env:
          SMOKE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          manifest="$(node ops/runtime-checksums.mjs)"
          docker run --detach --name ultron-image-smoke --publish 127.0.0.1:39171:3000 \
            --env PORT=3000 --env CRYPTO_PROVIDER=crypto-com-app \
            --env "ULTRON_BOOTSTRAP_COMMIT=$SMOKE_COMMIT" \
            --env "ULTRON_BOOTSTRAP_MANIFEST=$manifest" \
            --volume "$PWD/ops/railway-image-bootstrap.mjs:/bootstrap.mjs:ro" \
            node:22-alpine node /bootstrap.mjs
          docker image inspect --format 'ULTRON_OFFICIAL_NODE_IMAGE={{index .RepoDigests 0}}' node:22-alpine
          trap 'docker logs --tail 80 ultron-image-smoke; docker rm --force ultron-image-smoke' EXIT
          for attempt in $(seq 1 80); do
            if node --input-type=module -e 'import assert from "node:assert/strict"; const r=await fetch("http://127.0.0.1:39171/health",{signal:AbortSignal.timeout(1000)});const h=await r.json();assert.equal(h.releaseCommit,process.env.SMOKE_COMMIT);assert.equal(h.providerId,"crypto-com-app");assert.equal(h.liveOrders,false);assert.equal(h.autonomousLiveOrders,false);assert.equal(h.apiConfigured,false)' >/dev/null 2>&1; then
              echo "Pinned source booted successfully using the official Node image"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' ultron-image-smoke)" != true ]; then
              exit 1
            fi
            sleep 2
          done
          exit 1
