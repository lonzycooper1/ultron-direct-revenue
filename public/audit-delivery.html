<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>ULTRON Audit Delivery</title><style>body{font:16px/1.6 system-ui;background:#071315;color:#e7f6f4;padding:24px;margin:auto;max-width:850px}article{padding:24px;border:1px solid #3b7478;border-radius:16px}input,button,select{font:inherit;padding:12px;margin:8px 0;max-width:100%}input{width:90%}button{cursor:pointer}p{overflow-wrap:anywhere}a{color:#9ae7df}</style><h1>Your audit delivery</h1><article><label>Private purchase code<input id="code" type="password" autocomplete="off"></label><button id="open">Open delivery</button><p id="status" role="status" aria-live="polite">Enter the code from your purchase confirmation.</p><div id="files" hidden><h2 id="title"></h2><p>Payment is rechecked before access. A prepared download is not confirmation that you received or accepted the work.</p><select id="format" aria-label="Download format"><option value="pdf">PDF report</option><option value="zip">ZIP with editable Markdown</option><option value="md">Editable Markdown</option></select><button id="download">Download</button><p id="version"></p><label><input id="acceptance" type="checkbox" style="width:auto">I reviewed and accept this exact report version.</label><button id="accept">Record acceptance</button></div></article><p><a href="/support">Support</a> · <a href="/services">Services</a></p><script>
let token='',sha='';const $=id=>document.getElementById(id),say=s=>$('status').textContent=s;
const fragment=new URLSearchParams(location.hash.slice(1));if(/^[a-f0-9]{48}$/.test(fragment.get('code')||''))$('code').value=fragment.get('code');history.replaceState(null,'',location.pathname);
async function request(path,body){const r=await fetch('/api/audit-delivery'+path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+token,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok)throw Error('Delivery unavailable or requires review. Contact support.');return r}
$('open').onclick=async()=>{try{token=$('code').value.trim();$('code').value='';$('files').hidden=true;const s=await (await request('')).json();sha=s.sha256;$('title').textContent=s.title;$('version').textContent='PDF version: '+sha;$('files').hidden=false;say(s.acceptedAt?'Acceptance recorded '+s.acceptedAt:'Payment verified. Download and review your report.')}catch(e){token='';say(e.message)}};
$('download').onclick=async()=>{try{const format=$('format').value,r=await request('/artifact?format='+format),url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download='ultron-audit.'+format;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);say('Download prepared. Review the file before accepting.')}catch(e){say(e.message)}};
$('accept').onclick=async()=>{try{if(!$('acceptance').checked)throw Error('Confirm that you reviewed this version.');await request('/accept',{accepted:true,sha256:sha});say('Your acceptance has been recorded. Thank you.')}catch(e){say(e.message)}};
</script></html>
