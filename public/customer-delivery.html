<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ULTRON private delivery</title><style>body{font:17px system-ui;max-width:800px;margin:auto;padding:24px;background:#10222a;color:#eef7f8}section{background:#19333c;padding:24px;border-radius:16px;margin:20px 0}input,button{font:inherit;padding:12px;width:100%;box-sizing:border-box;margin:12px 0}button{cursor:pointer}pre{white-space:pre-wrap}a{color:#a6e3cb}</style><h1>Your private delivery</h1><p>Review and download the printable resource agreed for your purchase. Payment and the exact resource are checked before access.</p><section><label>Private delivery code or purchase link<input id="code" type="password" autocomplete="off"></label><button id="open">Open my delivery</button><p id="notice" role="status"></p></section><section id="delivery" hidden><h2 id="title"></h2><p id="scope"></p><p id="status"></p><button id="pdf">Download PDF</button><button id="zip">Download complete package</button><label><input id="agree" type="checkbox" style="width:auto">I reviewed the downloaded resource and accept this version.</label><button id="accept">Record my acceptance</button></section><p><a href="/support">Get support</a></p><script>
const $=id=>document.getElementById(id);let token='',current=null;
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+token,...(body?{'content-type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error('Your delivery is unavailable or requires review. Please contact support.');return r}
async function load(){current=await (await request('/api/customer-journey/buyer')).json();$('title').textContent=current.title;$('scope').textContent=current.scope;$('status').textContent=current.acceptedAt?'Acceptance recorded':'Ready for your review';$('delivery').hidden=false}
$('open').onclick=async()=>{token=$('code').value.trim();if(token.startsWith('https://')){try{const link=new URL(token);if(link.origin!==location.origin)throw Error();token=link.searchParams.get('token')||''}catch{token=''}}$('code').value='';$('delivery').hidden=true;try{await load();$('notice').textContent='Your private delivery is ready'}catch(e){$('notice').textContent=e.message}};
for(const format of ['pdf','zip'])$(format).onclick=async()=>{try{const r=await request('/api/customer-journey/buyer/artifact?format='+format),url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download='ultron-delivery.'+format;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){$('notice').textContent=e.message}};
$('accept').onclick=async()=>{try{if(!$('agree').checked)throw Error('Review the downloaded resource and select the acceptance box first');await request('/api/customer-journey/buyer/accept',{accepted:true,sha256:current.sha256});await load();$('notice').textContent='Thank you. Your acceptance was recorded.'}catch(e){$('notice').textContent=e.message}};
</script></html>
