<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ULTRON audit review</title><style>body{max-width:1000px;margin:30px auto;padding:20px;font:16px system-ui;background:#071719;color:#e6f4f2}a{color:#8ee4cc}input,select,textarea,button{font:inherit;margin:6px;padding:10px}label{display:block}article,fieldset{border:1px solid #416361;border-radius:12px;padding:18px;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}</style></head><body><a href="/services">Service workspace</a><h1>Audit preparation and review</h1><p>Owner access only. Prepare from actual supplied inputs, inspect every PDF page, verify factual claims, then approve the exact PDF hash. Preparation creates no payment, message or customer acceptance.</p><label>Owner access token <input id="token" type="password" autocomplete="off"></label><button id="load">Load private packages</button><form id="prepare"><fieldset><legend>Prepare a report</legend><label>Business <input name="company" required maxlength="120"></label><label>Public HTTPS page <input name="website" type="url" required></label><label>Industry <select name="industry"><option>other</option><option>plumbing</option><option>professional-services</option><option>home-services</option></select></label><label>Supplied monthly leads <input name="monthlyLeads" type="number" min="0" max="100000"></label><label>Supplied missed-lead percent <input name="missedPercent" type="number" min="0" max="100"></label><label>Supplied response minutes <input name="responseMinutes" type="number" min="0" max="10080"></label><label>Booking <select name="bookingMethod"><option value="unknown">Not supplied</option><option>phone</option><option>form</option><option>online-booking</option><option>social</option><option>mixed</option></select></label><label>Follow-up <select name="followup"><option value="unknown">Not supplied</option><option>none</option><option>manual</option><option>inconsistent</option><option>automated</option></select></label><label>Main problem <textarea name="mainProblem" maxlength="300"></textarea></label><label><input id="consent" type="checkbox" required> I have authorization to use these supplied business inputs. Leave unknown measurements blank; they will be labeled unknown.</label><button>Prepare private PDF package</button></fieldset></form><p id="status" role="status"></p><div id="packages"></div><script>
const $=id=>document.getElementById(id);let key='';const message=x=>$('status').textContent=x;
async function api(path,body){key=$('token').value||key;const r=await fetch('/api/audit-delivery/owner'+path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+key,...(body?{'content-type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok){const x=await r.json();throw Error(x.error||'Request failed')}return r}
async function download(p,format){const r=await api('/artifact?id='+encodeURIComponent(p.id)+'&format='+format),url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download='audit-'+p.id+'.'+format;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
async function load(){const x=await(await api('')).json();$('packages').replaceChildren();for(const p of x.packages){const card=document.createElement('article'),h=document.createElement('h2'),meta=document.createElement('pre');h.textContent=p.manifest.title;meta.textContent=p.id+'\n'+p.status+'\n'+p.manifest.pages+' pages\nSHA-256 '+p.manifest.pdfSha256+'\n'+(p.review?'Reviewed '+p.review.at:'Owner review pending');card.append(h,meta);for(const format of ['pdf','zip','md']){const b=document.createElement('button');b.textContent='Download '+format;b.onclick=()=>download(p,format).catch(e=>message(e.message));card.append(b)}const reviewer=document.createElement('input');reviewer.placeholder='Reviewer name';const check=document.createElement('input');check.type='checkbox';const label=document.createElement('label');label.append(check,document.createTextNode('I reviewed every rendered page, source references and factual claims.'));const approve=document.createElement('button');approve.textContent='Approve this exact document';const release=document.createElement('input');release.type='checkbox';const releaseLabel=document.createElement('label');releaseLabel.append(release,document.createTextNode('Also approve this reviewed sample for $99 checkout release. This does not send or publish anything.'));approve.onclick=async()=>{try{if(!check.checked)throw Error('Review the PDF and confirm the checklist first');await api('/review',{id:p.id,sha256:p.manifest.pdfSha256,allPagesReviewed:true,factsChecked:true,reviewer:reviewer.value,releaseApproved:release.checked});await load()}catch(e){message(e.message)}};card.append(reviewer,label,releaseLabel,approve);$('packages').append(card)}}
$('load').onclick=()=>load().catch(e=>message(e.message));$('prepare').onsubmit=async e=>{e.preventDefault();const x={...Object.fromEntries(new FormData(e.target)),authorizationConfirmed:$('consent').checked};for(const k of ['monthlyLeads','missedPercent','responseMinutes'])x[k]=String(x[k]).trim()===''?null:Number(x[k]);try{await api('/prepare',x);message('Private package prepared. Inspect the PDF before reviewing.');await load()}catch(e){message(e.message)}};
</script></body></html>
